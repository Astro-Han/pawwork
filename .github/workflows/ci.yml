name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint:ci
      - name: Test PawWork and its DSH integration
        run: pnpm run test
      - name: Audit dependency graph
        run: pnpm audit --audit-level high

  package_smoke:
    name: desktop / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            platform: darwin
            arch: arm64
            builder_args: --mac dir --arm64 --publish never --config electron-builder.config.ts --config.mac.identity=- --config.mac.notarize=false
            development_smoke: true
          - name: macOS x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
            builder_args: --mac dir --x64 --publish never --config electron-builder.config.ts --config.mac.identity=- --config.mac.notarize=false
            development_smoke: false
          - name: Windows x64
            runner: windows-latest
            platform: win32
            arch: x64
            builder_args: --win dir --x64 --publish never --config electron-builder.config.ts
            development_smoke: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare bundled uv
        run: pnpm exec tsx ./scripts/prepare-uv.ts --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
        working-directory: packages/desktop-electron
      - name: Build desktop
        run: pnpm run build
        working-directory: packages/desktop-electron
        env:
          OPENCODE_CHANNEL: dev
      - name: Smoke development desktop through CDP
        if: matrix.development_smoke
        run: pnpm run smoke:ci
        working-directory: packages/desktop-electron
        env:
          PAWWORK_CI_SMOKE_CDP: "true"
      - name: Package desktop app
        run: pnpm exec electron-builder ${{ matrix.builder_args }}
        working-directory: packages/desktop-electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          OPENCODE_CHANNEL: dev
      - name: Smoke packaged desktop through CDP
        run: pnpm exec tsx ./scripts/ci-smoke.ts packaged dev
        working-directory: packages/desktop-electron
        env:
          PAWWORK_CI_SMOKE_CDP: "true"
          PAWWORK_CI_SCREENSHOT_PATH: ${{ runner.temp }}/pawwork-windows-smoke.png

      - name: Upload Windows smoke screenshot
        if: ${{ always() && matrix.platform == 'win32' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pawwork-windows-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pawwork-windows-smoke.png
          if-no-files-found: error
          retention-days: 7

  desktop_smoke:
    name: desktop-smoke
    if: always()
    needs: [package_smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Validate desktop smoke results
        env:
          RESULT: ${{ needs.package_smoke.result }}
        run: test "$RESULT" = success
