name: desktop-smoke

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: desktop-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare bundled uv
        run: pnpm exec tsx ./scripts/prepare-uv.ts --platform darwin --arch arm64
        working-directory: packages/desktop-electron
      - name: Build desktop
        run: pnpm run build
        working-directory: packages/desktop-electron
        env:
          OPENCODE_CHANNEL: dev
      - name: Smoke development desktop through CDP
        run: pnpm run smoke:ci
        working-directory: packages/desktop-electron
        env:
          PAWWORK_CI_SMOKE_CDP: "true"
      - name: Package macOS app
        run: npx electron-builder --mac dir --arm64 --publish never --config electron-builder.config.ts --config.mac.identity=- --config.mac.notarize=false
        working-directory: packages/desktop-electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          OPENCODE_CHANNEL: dev
      - name: Smoke packaged macOS app through CDP
        run: pnpm exec tsx ./scripts/ci-smoke.ts packaged dev "dist/mac-arm64/PawWork Dev.app/Contents/MacOS/PawWork Dev"
        working-directory: packages/desktop-electron
        env:
          PAWWORK_CI_SMOKE_CDP: "true"

  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare bundled uv
        run: pnpm exec tsx ./scripts/prepare-uv.ts --platform win32 --arch x64
        working-directory: packages/desktop-electron
      - name: Build desktop
        run: pnpm run build
        working-directory: packages/desktop-electron
        env:
          OPENCODE_CHANNEL: dev
      - name: Package Windows app
        run: npx electron-builder --win dir --x64 --publish never --config electron-builder.config.ts
        working-directory: packages/desktop-electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          OPENCODE_CHANNEL: dev
      - name: Smoke packaged Windows app through CDP
        run: pnpm exec tsx ./scripts/ci-smoke.ts packaged dev "dist/win-unpacked/PawWork Dev.exe"
        working-directory: packages/desktop-electron
        env:
          PAWWORK_CI_SMOKE_CDP: "true"

  check:
    if: always()
    needs: [macos-arm64, windows-x64]
    runs-on: ubuntu-latest
    steps:
      - name: Validate desktop smoke results
        env:
          MACOS_RESULT: ${{ needs.macos-arm64.result }}
          WINDOWS_RESULT: ${{ needs.windows-x64.result }}
        run: test "$MACOS_RESULT" = success && test "$WINDOWS_RESULT" = success
