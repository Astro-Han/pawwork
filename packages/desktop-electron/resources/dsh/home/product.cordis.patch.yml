# PawWork product defaults. Applied after the official web profile via --patch.
# Later user settings still win. A patch replaces the targeted row's whole config.
- id: agent-default-model
  config:
    provider: opencode
    model: big-pickle
- id: llm-pi-ai
  config:
    providers:
      opencode:
        apiKeyEnv: OPENCODE_API_KEY
        displayName: OpenCode Free
        models:
          - id: big-pickle
          - id: deepseek-v4-flash-free
          - id: laguna-s-2.1-free
          - id: ling-3.0-flash-free
          - id: mimo-v2.5-free
          - id: nemotron-3-ultra-free
          - id: north-mini-code-free
- id: agent-instructions
  config:
    dshHome: "~/.pawwork"
    maxBytes: 65536
- id: llm-deepseek
  disabled: true
# Every provider dsh-base mounts needs a vendor key, and PawWork ships OpenCode
# Free as its default model, so most installs hold none and the first search
# fails. Pointing the seam at the PawWork provider — Exa's anonymous allowance —
# is what makes search work before anyone configures anything. The keyed
# providers stay mounted behind their own settings cards; letting the user pick
# between them needs a settings surface the seam does not have yet, since
# `searchProvider` is resolved once at construction.
- id: web
  config:
    searchProvider: pawwork
# The market must wait for PawWork's generation-scoped Desktop services. Their
# presence selects its managed package runtime and makes self-restart unavailable.
- id: dsh-market
  inject:
    - desktopProfiles
    - desktopPnpm
- insert:
    - id: pawwork-identity
      name: '@pawwork/dsh-identity'
    - id: pawwork-product
      name: '@pawwork/dsh-product'
    - id: import-v1
      name: '../../plugins/import-v1/index.mjs'
    - id: pawwork-automations
      name: '@pawwork/dsh-automations'
    - id: pawwork-web-search
      name: '@pawwork/dsh-web-search'
