# PawWork product defaults. Applied after the official web profile via --patch.
# Later user settings still win. A patch replaces the targeted row's whole config.
- id: agent-default-model
  config:
    provider: opencode
    model: big-pickle
- id: llm-pi-ai
  config:
    providers:
      opencode:
        apiKeyEnv: OPENCODE_API_KEY
        displayName: OpenCode Free
        models:
          - id: big-pickle
          - id: deepseek-v4-flash-free
          - id: laguna-s-2.1-free
          - id: ling-3.0-flash-free
          - id: mimo-v2.5-free
          - id: nemotron-3-ultra-free
          - id: north-mini-code-free
- id: agent-instructions
  config:
    dshHome: "~/.pawwork"
    maxBytes: 65536
- id: llm-deepseek
  disabled: true
# Web search runs through the PawWork provider, which picks its backend from
# settings rather than from this file. The seam resolves `searchProvider` once at
# construction, so a per-vendor mount could only be re-pointed by editing here and
# restarting; one provider that switches internally makes the choice a setting.
- id: web
  config:
    searchProvider: pawwork
# dsh-base mounts the DeepSeek provider with `DEEPSEEK_API_KEY`. PawWork ships
# OpenCode Free as its default model, so most installs hold no such key and that
# provider fails on the first search. It stays available as a backend of the row
# below — which resolves the same credential — so disabling the standalone mount
# removes a duplicate settings card, not the capability.
- id: web-search-deepseek
  disabled: true
# The market must wait for PawWork's generation-scoped Desktop services. Their
# presence selects its managed package runtime and makes self-restart unavailable.
- id: dsh-market
  inject:
    - desktopProfiles
    - desktopPnpm
- insert:
    - id: pawwork-identity
      name: '@pawwork/dsh-identity'
    - id: pawwork-product
      name: '@pawwork/dsh-product'
    - id: import-v1
      name: '../../plugins/import-v1/index.mjs'
    - id: pawwork-automations
      name: '@pawwork/dsh-automations'
    - id: pawwork-web-search
      name: '@pawwork/dsh-web-search'
