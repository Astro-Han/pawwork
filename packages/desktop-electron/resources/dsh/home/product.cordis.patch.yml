# PawWork product defaults. Applied after the official web profile via --patch.
# Later user settings still win. A patch replaces the targeted row's whole config.
- id: agent-default-model
  config:
    provider: opencode
    model: big-pickle
- id: llm-pi-ai
  config:
    providers:
      opencode:
        apiKeyEnv: OPENCODE_API_KEY
        displayName: OpenCode Free
        models:
          - id: big-pickle
          - id: deepseek-v4-flash-free
          - id: laguna-s-2.1-free
          - id: ling-3.0-flash-free
          - id: mimo-v2.5-free
          - id: nemotron-3-ultra-free
          - id: north-mini-code-free
- id: agent-instructions
  config:
    dshHome: "~/.pawwork"
    maxBytes: 65536
- id: llm-deepseek
  disabled: true
# The market can otherwise spawn a replacement DSH process outside PawWork's
# single lifecycle authority. PawWork exposes the restart action in its host tab.
- id: dsh-market
  config:
    allowRestart: false
- insert:
    - id: pawwork-identity
      name: '@pawwork/dsh-identity'
    - id: pawwork-product
      name: '@pawwork/dsh-product'
    - id: import-v1
      name: '../../plugins/import-v1/index.mjs'
    - id: pawwork-automations
      name: '@pawwork/dsh-automations'
