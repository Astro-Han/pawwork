packages:
  - packages/desktop-electron
  - site

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: false
  sharp: true
  workerd: false

minimumReleaseAgeExclude:
  - '@deepseek-ai/*'

overrides:
  '@xmldom/xmldom': 0.8.13
  brace-expansion: 5.0.9
  esbuild: 0.28.1
  fast-uri: 3.1.5
  form-data: 4.0.6
  ip-address: 10.3.1
  js-yaml: 4.3.1
  lodash: 4.18.1
  nanoid: 3.3.18
  postcss: 8.5.23
  sharp: 0.35.3
  svgo: 4.0.2
  tar: 7.5.21
  tmp: 0.2.7
  vite: 7.3.5
  ws: 8.21.0

patchedDependencies:
  '@deepseek-ai/dsh-llm-pi-ai@0.1.1-rc.2': patches/@deepseek-ai__dsh-llm-pi-ai@0.1.1-rc.2.patch
  brace-expansion@5.0.9: patches/brace-expansion@5.0.9.patch
