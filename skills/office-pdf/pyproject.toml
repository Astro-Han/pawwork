[project]
name = "pawwork-office-pdf"
version = "0.0.0"
requires-python = ">=3.9"
# Parsing/extraction only. Both are permissive-licensed:
#   pdfplumber -> MIT (layout-aware text + tables)
#   pypdf      -> BSD  (fast text, metadata, split/merge)
# PDF GENERATION does not use these — it goes through the bundled Chromium
# printToPDF (see SKILL.md). Never add PyMuPDF / fitz here (AGPL).
dependencies = [
  "pdfplumber==0.11.4",
  "pypdf==6.14.2",
]
