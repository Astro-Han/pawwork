[workspace]
resolver = "2"
members = ["crates/pawwork-core", "crates/pawwork-cli"]

[workspace.package]
edition = "2021"
# 1.89 is the floor for std File::try_lock (the single-writer lock). It is a
# documented minimum, not a CI-gated one: rust-toolchain.toml tracks stable so
# CI keeps the newest lints. Pin the toolchain to 1.89.x only if a real MSRV
# gate is needed later.
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
# tokio is kept minimal on purpose: the core lib only needs `sync` (mpsc for the
# event stream). The runtime flavor is chosen by the binary's #[tokio::main], not
# here, so the core stays runtime-agnostic (see docs section 13). macros/rt land
# in dev-dependencies and the CLI, not the lib.
tokio = { version = "1", default-features = false, features = ["sync"] }
# CancellationToken (cooperative interruption; child tokens are the future
# subagent shape). Preferred over a hand-rolled watch channel.
tokio-util = { version = "0.7", default-features = false }
# The only network dependency: an async HTTP client for the streaming
# chat/completions call. default-features are off to drop native-tls/OpenSSL in
# favour of rustls (no system OpenSSL needed on macOS/Windows). The SSE body is
# driven with Response::chunk(), so the `stream`/`json` features are unnecessary;
# framing and chunk JSON are hand-parsed in openai_compat. reqwest pulls hyper +
# tokio rt/net transitively; that is a binary-side build-graph effect and does
# not widen the core's own direct tokio features (still `sync`).
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
    "charset",
] }
